<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Security Corner</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header>
  <span class="brand">Security Corner</span>
  <nav id="nav">
    <button data-view="progress" class="on">My progress</button>
    <button data-view="check">Check an email</button>
    <button data-view="quiz">Quiz</button>
  </nav>
  <span class="right" id="who"></span>
</header>

<main class="narrow">
  <div class="card hidden" id="id-card">
    <label for="uid">Your employee ID (e.g. fin-007)</label>
    <div class="row" style="margin-top:0"><input id="uid" style="margin:0;flex:1"><button class="btn" id="uid-save">Continue</button></div>
    <p class="muted small">Pseudonymous: your name is never stored.</p>
  </div>

  <!-- PROGRESS -->
  <section id="v-progress">
    <h1>Your week in security</h1>
    <p class="lead" id="period"></p>
    <div id="prog-out"></div>
  </section>

  <!-- CHECK -->
  <section id="v-check" class="hidden">
    <h1>Is this phishing?</h1>
    <p class="lead">Paste a suspicious email (include the From line if you can). Nothing is saved.</p>
    <form class="card" id="check-form">
      <textarea id="mail" required style="min-height:200px" placeholder="From: ...&#10;Subject: ...&#10;&#10;Email text"></textarea>
      <button class="btn">Check</button>
    </form>
    <div id="check-out"></div>
  </section>

  <!-- QUIZ -->
  <section id="v-quiz" class="hidden">
    <h1>Security quiz</h1>
    <p class="lead">A few quick questions.</p>
    <div class="card" id="pick">
      <label for="dept">Your department</label><select id="dept"></select>
      <label for="quiz">Quiz</label><select id="quiz"></select>
      <button class="btn" id="start">Start</button>
    </div>
    <form id="qform" class="hidden"></form>
    <div id="result"></div>
  </section>
</main>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } },
                set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
let QUIZZES = [], UID = new URLSearchParams(location.search).get("u") || store.get("spai_uid") || "";
if (UID) store.set("spai_uid", UID);

async function busy(btn, label, fn) {
  const old = btn.innerHTML; btn.disabled = true; btn.innerHTML = `<span class="spinner"></span>${label}`;
  try { return await fn(); } finally { btn.disabled = false; btn.innerHTML = old; }
}

function showWho() {
  $("#who").innerHTML = UID ? `${esc(UID)} · <a href="#" id="switch">switch</a>` : "";
  if (UID) $("#switch").onclick = (e) => { e.preventDefault(); UID = ""; store.set("spai_uid", ""); showWho(); show("progress"); };
}

// ---------- progress ----------
const stat = (n, label) => `<div><div style="font-size:26px;font-weight:650">${n}</div><div class="muted small">${label}</div></div>`;
async function loadProgress() {
  $("#id-card").classList.toggle("hidden", !!UID);
  if (!UID) { $("#prog-out").innerHTML = ""; $("#period").textContent = "Enter your employee ID to see your progress."; return; }
  const p = await (await fetch(`/progress/${encodeURIComponent(UID)}`)).json();
  if (!p.found) { $("#period").textContent = ""; $("#prog-out").innerHTML = `<div class="card muted">No activity yet for ${esc(UID)}. Take a quiz to get started.</div>`; return; }
  const w = p.week, m = p.month;
  $("#period").textContent = `${p.department} · ${p.period[0]} to ${p.period[1]}`;
  const team = p.team.recent_weeks.filter((x) => x.click_rate != null);
  const teamLine = team.length === 2 ? `Your team's click rate went from ${Math.round(team[0].click_rate * 100)}% to ${Math.round(team[1].click_rate * 100)}%.`
                 : team.length === 1 ? `Your team's click rate this week: ${Math.round(team[0].click_rate * 100)}%.` : "";
  $("#prog-out").innerHTML = `
    <div class="card"><h2>${esc(p.headline)}</h2>
      <div class="grid" style="margin-top:14px">${stat(w.avoided, "phishing avoided")}${stat(w.reported, "reported")}
        ${stat(w.quiz_avg == null ? "–" : Math.round(w.quiz_avg * 100) + "%", "quiz average")}${stat(p.streak_weeks, "week streak")}</div>
      <ul style="margin-top:16px">${p.lines.slice(1).map((l) => `<li>${esc(l)}</li>`).join("")}</ul>
      ${teamLine ? `<p class="muted small">${esc(teamLine)}</p>` : ""}
    </div>
    ${p.tips.length ? `<div class="card"><h3 style="margin-top:0">Tips for next time</h3><ul>${p.tips.map((t) => `<li>${esc(t)}</li>`).join("")}</ul></div>` : ""}
    <p class="muted small">This month: ${m.avoided} avoided · ${m.reported} reported · ${m.quizzes} quiz(zes)${m.quiz_avg != null ? ` · average ${Math.round(m.quiz_avg * 100)}%` : ""}</p>`;
}
$("#uid-save").onclick = () => { UID = $("#uid").value.trim(); if (UID) { store.set("spai_uid", UID); showWho(); loadProgress(); } };

// ---------- check ----------
$("#check-form").onsubmit = (e) => {
  e.preventDefault();
  busy($("#check-form .btn"), "Checking", async () => {
    const r = await (await fetch("/check", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: $("#mail").value }) })).json();
    if (!r.verdict) { $("#check-out").innerHTML = `<div class="card">${esc(r.detail?.[0]?.msg || "Could not check this text.")}</div>`; return; }
    const cls = r.verdict === "likely phishing" ? "bad" : r.verdict === "suspicious" ? "warn" : "good";
    $("#check-out").innerHTML = `<div class="card"><span class="pill ${cls}" style="font-size:14px">${esc(r.verdict)}</span>
      ${r.explanation ? `<p>${esc(r.explanation)}</p>` : ""}
      ${r.flags.length ? `<h3>Warning signs</h3><ul>${r.flags.map((f) => `<li>${esc(f)}</li>`).join("")}</ul>` : ""}
      <h3>What to do</h3><ul>${r.what_to_do.map((f) => `<li>${esc(f)}</li>`).join("")}</ul>
      ${r.sources.length ? `<details><summary>Based on</summary><ul class="small">${r.sources.map((s) => `<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a></li>`).join("")}</ul></details>` : ""}
    </div>`;
  });
};

// ---------- quiz ----------
async function loadQuiz() {
  const meta = await (await fetch("/meta")).json();
  $("#dept").innerHTML = meta.departments.map((d) => `<option>${esc(d)}</option>`).join("");
  const guess = meta.departments.find((d) => UID.toLowerCase().startsWith(d.slice(0, 3).toLowerCase()));
  if (guess) $("#dept").value = guess;
  QUIZZES = await (await fetch("/quizzes")).json();
  $("#quiz").innerHTML = QUIZZES.map((q, i) => `<option value="${i}">${esc(q.title)}</option>`).join("") || "<option disabled>No quizzes yet</option>";
  $("#start").disabled = !QUIZZES.length;
}
$("#start").onclick = () => {
  const q = QUIZZES[$("#quiz").value];
  $("#pick").classList.add("hidden"); $("#qform").classList.remove("hidden"); $("#result").innerHTML = "";
  $("#qform").innerHTML = q.questions.map((x, i) => `<div class="card"><p><b>${i + 1}. ${esc(x.question)}</b></p>
    ${x.options.map((o, j) => `<label style="color:inherit;font-size:15px;margin:6px 0"><input type="radio" name="q${i}" value="${j}" style="width:auto;margin:0 8px 0 0">${esc(o)}</label>`).join("")}
    </div>`).join("") + '<button class="btn">Submit</button>';
  $("#qform").onsubmit = async (e) => {
    e.preventDefault();
    const answers = q.questions.map((_, i) => { const c = document.querySelector(`input[name=q${i}]:checked`); return c ? +c.value : null; });
    const r = await (await fetch(`/quizzes/${q.id}/submit`, { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ department: $("#dept").value, answers, user_id: UID || null }) })).json();
    $("#qform").classList.add("hidden");
    $("#result").innerHTML = `<div class="card"><h2>You scored ${Math.round(r.score * 100)}%</h2>
      ${r.results.map((x, i) => `<p>${x.correct ? "✅" : "❌"} <b>${esc(x.question)}</b><br>
      <span class="muted small">Answer: ${esc(q.questions[i].options[x.correct_index])}. ${esc(x.explanation)}</span></p>`).join("")}
      <button class="btn ghost" onclick="location.reload()">Another quiz</button></div>`;
  };
};

// ---------- nav ----------
const loaders = { progress: loadProgress, quiz: loadQuiz };
function show(view) {
  document.querySelectorAll("main > section").forEach((s) => s.classList.toggle("hidden", s.id !== `v-${view}`));
  document.querySelectorAll("#nav button").forEach((b) => b.classList.toggle("on", b.dataset.view === view));
  $("#id-card").classList.toggle("hidden", !!UID || view !== "progress");
  history.replaceState(null, "", `#${view}`);
  loaders[view]?.();
}
$("#nav").onclick = (e) => e.target.dataset.view && show(e.target.dataset.view);
showWho();
show(location.hash.slice(1) || "progress");
</script>
</body>
</html>
